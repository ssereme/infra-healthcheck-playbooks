---
# ==============================================================================
# Playbook: Carrier-Grade Cloud Pre-Maintenance Healthcheck
# Author: Soumaila Sereme
# Description: Automated pre-MOP validation for OpenStack (CBIS) & Ceph clusters
# ==============================================================================

- name: Pre-Maintenance Infrastructure Readiness Audit
  hosts: all
  become: true
  gather_facts: true

  vars:
    disk_usage_threshold: 80

  tasks:
    - name: 1. Validate Root and Var Filesystem Capacity (< {{ disk_usage_threshold }}%)
      ansible.builtin.shell: |
        set -o pipefail
        df -P / /var | awk 'NR>1 {gsub("%","",$5); if ($5 > {{ disk_usage_threshold }}) exit 1}'
      args:
        executable: /bin/bash
      register: disk_check
      changed_when: false
      failed_when: disk_check.rc != 0

    - name: 2. Verify Chrony NTP Time Synchronization
      ansible.builtin.command: chronyc tracking
      register: ntp_status
      changed_when: false
      failed_when: "'Leap status     : Normal' not in ntp_status.stdout"

    - name: 3. Check Pacemaker Cluster Status on Control Plane Nodes
      ansible.builtin.command: pcs status
      register: pcs_health
      changed_when: false
      when: "'controllers' in group_names"
      failed_when: "'Online:' not in pcs_health.stdout"

    - name: 4. Validate Ceph Storage Cluster Health (Monitors Only)
      ansible.builtin.command: ceph health
      register: ceph_health
      changed_when: false
      when: "'ceph_mons' in group_names"
      failed_when: "'HEALTH_ERR' in ceph_health.stdout"

    - name: 5. Check for Stuck or Down Ceph OSDs
      ansible.builtin.shell: |
        set -o pipefail
        ceph osd stat | grep -E "down|out" || true
      args:
        executable: /bin/bash
      register: osd_stat
      changed_when: false
      when: "'ceph_mons' in group_names"

    - name: 6. Audit Summary Report
      ansible.builtin.debug:
        msg: "✅ Node {{ inventory_hostname }} passed all pre-maintenance readiness checks."